AutoName: Haushaltsbuch
Summary: Persönliches Haushaltsbuch, komplett offline
Description: |-
    Haushaltsbuch verwaltet Konten, Kategorien, Buchungen und Budgets -
    komplett offline. Alle Daten bleiben ausschließlich in einer lokalen
    SQLite-Datenbank auf dem Gerät. Es gibt keinen Server, kein Nutzerkonto
    und keine Cloud-Anbindung.

    Funktionen:

    * Mehrere Konten mit Kategorien und Tags
    * Budgets pro Kategorie und Konto, mit Dauerbudgets
    * Daueraufträge (monatlich/quartalsweise/jährlich)
    * CSV- und PDF-Kontoauszug-Import (auf das DKB-Layout zugeschnitten)
    * Backup/Wiederherstellen als JSON-Datei über den Android-Teilen-Dialog

