services:
  haushaltsbuch:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: haushaltsbuch
    restart: unless-stopped
    ports:
      # Erreichbar im Heimnetz unter http://<server-ip>:8090
      # Nur lokal? Dann "127.0.0.1:8090:8090" eintragen.
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
